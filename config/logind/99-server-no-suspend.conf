# Keep the box awake for remote LM Studio / cloudflared (amd-halo).
# Installed by bin/configure-server-power.sh into /etc/systemd/logind.conf.d/
[Login]
IdleAction=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
